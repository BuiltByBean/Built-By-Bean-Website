<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Scripture API">
  <!-- NOT a brand mark. Crossway publishes no icon for the ESV API, and the
       rule in this folder is that logos are fetched rather than drawn — so
       rather than invent one, this is the same open-book glyph the playbooks
       UI already uses, on a neutral ground.

       The neutral is the point: every other tile carries a vendor's own
       colour, so a slate one reads as "there is no mark here" instead of
       claiming to be Crossway's. -->
  <rect width="48" height="48" rx="10" fill="#334155"/>
  <g transform="translate(11 11) scale(1.0833)" fill="none" stroke="#fff"
     stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
  </g>
</svg>
