<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Built By Bean</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    /* Same values as pm/base.html, which took them from the
                       public site. This page stands on its own rather than
                       extending base, so the palette has to be repeated. */
                    colors: {
                        brand: { 300: '#d8b4fe', 400: '#c084fc', 500: '#a855f7', 600: '#9333ea', 700: '#7e22ce' },
                        surface: { 50: '#fafafa', 100: '#f4f4f5', 200: '#e4e4e7', 300: '#d4d4d8', 400: '#a1a1aa', 700: '#3f3f46', 800: '#2a2a32', 900: '#1a1a1f', 950: '#0a0a0b' },
                        accent: { 400: '#38bdf8' }
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --primary: #c084fc;
            --primary-dark: #a855f7;
            --primary-rgb: 168, 85, 247;
            --accent: #38bdf8;
            --accent-rgb: 56, 189, 248;
            --bg: #0a0a0b;
            --border: #2a2a32;
        }
        body { font-family: 'Inter', system-ui, sans-serif; }
        .mesh-bg {
            background-color: var(--bg);
            background-image:
                radial-gradient(at 40% 20%, rgba(var(--primary-rgb), 0.15) 0px, transparent 50%),
                radial-gradient(at 80% 0%, rgba(var(--accent-rgb), 0.10) 0px, transparent 50%);
        }
        .input-ring { border-radius: 8px; border: 1px solid var(--border); transition: all 0.2s ease; background: rgba(10,10,11,0.5); color: #e4e4e7; }
        .input-ring:focus { outline: none; border-color: var(--primary-dark); box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.25); }
        .logo-mark {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-mask-image: var(--logo-src); mask-image: var(--logo-src);
            -webkit-mask-size: contain; mask-size: contain;
            -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
            -webkit-mask-position: center; mask-position: center;
        }
        .btn-brand {
            position: relative; isolation: isolate; overflow: hidden; color: #fff;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 55%, var(--accent) 140%);
            box-shadow:
                0 10px 30px -8px rgba(var(--primary-rgb), 0.5),
                0 0 0 1px rgba(var(--primary-rgb), 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }
        .btn-brand:hover {
            transform: translateY(-2px);
            box-shadow:
                0 18px 44px -8px rgba(var(--primary-rgb), 0.65),
                0 0 60px -6px rgba(var(--accent-rgb), 0.3),
                0 0 0 1px rgba(var(--primary-rgb), 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
        }
    </style>
</head>
<body class="mesh-bg min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="logo-mark inline-block w-16 h-16 mb-4"
                 style="--logo-src: url('{{ url_for('static', filename='images/logo.png') }}?v={{ asset_version }}')"></div>
            <h1 class="text-2xl font-bold text-white">Set New Password</h1>
            <p class="text-surface-400 text-sm mt-1">You must change your password before continuing.</p>
        </div>

        <div class="bg-surface-900/60 backdrop-blur-xl rounded-2xl border border-white/8 shadow-xl p-8">
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="mb-4 px-4 py-3 rounded-xl text-sm
                        {% if category == 'error' %}bg-red-900/20 text-red-400
                        {% else %}bg-brand-900/20 text-brand-400{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-surface-300 mb-1.5">New Password</label>
                    <input type="password" name="new_password" required minlength="6"
                           class="input-ring w-full px-4 py-2.5 text-sm placeholder-surface-500"
                           placeholder="At least 6 characters">
                </div>
                <div>
                    <label class="block text-sm font-medium text-surface-300 mb-1.5">Confirm Password</label>
                    <input type="password" name="confirm_password" required
                           class="input-ring w-full px-4 py-2.5 text-sm placeholder-surface-500"
                           placeholder="Repeat new password">
                </div>
                <button type="submit"
                        class="w-full py-2.5 px-4 btn-brand font-medium rounded-xl shadow-lg transition-all duration-200">
                    Update Password
                </button>
            </form>
        </div>
    </div>
</body>
</html>
